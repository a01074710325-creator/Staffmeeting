<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말랑말랑 유럽 단원 몸풀기 퀴즈</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div id="start-screen" class="screen">
            <h1 class="title-text">🎈 유럽 단원 몸풀기 퀴즈 🎈</h1>
            <p>유럽에 대해 얼마나 알고 있나요?</p>
            <p class="warning">※ 귀여운 소리가 납니다. 볼륨을 조절해 주세요!</p>
            <button id="start-game-btn" class="game-btn pulse">퀴즈 시작하기 🚀</button>
        </div>

        <main id="quiz-section" class="screen hide">
            <header>
                <div class="hud">
                    <span id="progress-text" class="badge">문제 1 / 10</span>
                    <span id="score-text" class="badge">점수: 0점</span>
                </div>
            </header>
            <div id="question-container">
                <h2 id="question">질문이 이곳에 표시됩니다.</h2>
                <div id="answer-buttons" class="btn-grid"></div>
                <div id="explanation-box" class="hide">
                    <p id="explanation-text"></p>
                    <button id="next-btn" class="game-btn">다음 문제로 넘어가기 ➔</button>
                </div>
            </div>
        </main>
        
        <div id="result-container" class="screen hide">
            <h2>🎉 퀴즈 완료! 최고예요! 🎉</h2>
            <p>총 10문제 중 <span id="score" class="highlight"></span>문제를 맞혔습니다.</p>
            <button id="restart-btn" class="game-btn">다시 도전하기 🌟</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
